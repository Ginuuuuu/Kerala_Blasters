<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Lush Kerala Training Ground & Golden Hour Stadium Sky -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A6B82"/>
      <stop offset="35%" stop-color="#91A8A4"/>
      <stop offset="65%" stop-color="#C2B89D"/>
      <stop offset="100%" stop-color="#738A62"/>
    </linearGradient>

    <!-- Tree Foliage Gradient (Matches the outdoor green background in the reference) -->
    <radialGradient id="foliageGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4D6B3C" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#344D27" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#1E2E18" stop-opacity="1"/>
    </radialGradient>

    <!-- Warm Cinematic Sunlight / Vignette Overlay -->
    <radialGradient id="sunGlow" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#FFE8B3" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#DDA477" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Soft Bottom Shadow for Characters -->
    <linearGradient id="bottomShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Sky & Horizon -->
  <rect width="600" height="400" fill="url(#skyGrad)"/>

  <!-- Outdoor Lush Greenery / Trees Background (inspired by reference photo) -->
  <g fill="url(#foliageGrad)">
    <circle cx="80" cy="180" r="160"/>
    <circle cx="220" cy="150" r="190"/>
    <circle cx="360" cy="140" r="180"/>
    <circle cx="500" cy="160" r="200"/>
    <circle cx="620" cy="190" r="170"/>
    <ellipse cx="300" cy="130" rx="350" ry="120"/>
  </g>

  <!-- Dappled Sunlight in Leaves -->
  <g fill="#A4C982" opacity="0.3">
    <circle cx="120" cy="120" r="14"/>
    <circle cx="160" cy="90" r="22"/>
    <circle cx="240" cy="100" r="18"/>
    <circle cx="320" cy="80" r="25"/>
    <circle cx="420" cy="110" r="16"/>
    <circle cx="490" cy="95" r="20"/>
  </g>

  <!-- Team Group: 5 Kerala Blasters Players & Staff Standing Arm-in-Arm -->
  <!-- Figure 1: Left Wing Player (Navy/Blue & Yellow Kit) -->
  <g id="figure1">
    <!-- Body -->
    <path d="M 60 400 L 95 240 Q 130 230 165 240 L 200 400 Z" fill="#003B7A"/>
    <!-- Yellow Shoulder Accents -->
    <path d="M 95 240 Q 130 248 165 240 L 155 270 Q 130 275 105 270 Z" fill="#F4B800"/>
    <!-- Neck -->
    <rect x="118" y="205" width="24" height="35" rx="6" fill="#C68658"/>
    <!-- Head -->
    <ellipse cx="130" cy="175" rx="28" ry="34" fill="#D29367"/>
    <!-- Hair -->
    <path d="M 102 170 Q 110 135 135 138 Q 160 140 158 172 Q 145 150 120 152 Q 106 155 102 170 Z" fill="#241B15"/>
    <!-- Smile & Eyes -->
    <path d="M 120 188 Q 130 198 140 188" stroke="#7A3D18" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="122" cy="172" r="2.5" fill="#3D2214"/>
    <circle cx="138" cy="172" r="2.5" fill="#3D2214"/>
  </g>

  <!-- Figure 2: Central Midfielder (Iconic KBFC Yellow Kit) -->
  <g id="figure2">
    <!-- Body -->
    <path d="M 155 400 L 185 220 Q 230 210 275 220 L 305 400 Z" fill="#F4B800"/>
    <!-- Collar & Blue Trim -->
    <path d="M 215 222 L 230 245 L 245 222 Z" fill="#003B7A"/>
    <path d="M 185 220 Q 230 232 275 220 L 265 245 Q 230 252 195 245 Z" fill="#003B7A" opacity="0.4"/>
    <!-- Neck -->
    <rect x="217" y="185" width="26" height="38" rx="6" fill="#B87648"/>
    <!-- Head -->
    <ellipse cx="230" cy="155" rx="27" ry="33" fill="#C98656"/>
    <!-- Hair -->
    <path d="M 203 150 Q 212 118 235 120 Q 258 122 257 152 Q 242 135 220 136 Z" fill="#1C1410"/>
    <!-- Smile & Eyes -->
    <path d="M 221 168 Q 230 178 239 168" stroke="#7A3D18" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="222" cy="153" r="2.5" fill="#241812"/>
    <circle cx="238" cy="153" r="2.5" fill="#241812"/>
  </g>

  <!-- Figure 3: Center Captain (White & Gold Heritage Training Kit) -->
  <g id="figure3">
    <!-- Body -->
    <path d="M 255 400 L 280 205 Q 330 195 380 205 L 405 400 Z" fill="#F8F8F8"/>
    <!-- Subtle Collar -->
    <path d="M 315 208 L 330 230 L 345 208 Z" fill="#DDA477"/>
    <!-- Neck -->
    <rect x="317" y="172" width="26" height="36" rx="6" fill="#D69870"/>
    <!-- Head -->
    <ellipse cx="330" cy="142" rx="28" ry="33" fill="#E2A67E"/>
    <!-- Hair & Beard -->
    <path d="M 302 138 Q 312 108 335 110 Q 358 112 358 140 Q 345 124 322 125 Z" fill="#261C14"/>
    <path d="M 318 152 Q 330 172 342 152 Q 340 168 330 170 Q 320 168 318 152 Z" fill="#261C14" opacity="0.8"/>
    <!-- Smile & Eyes -->
    <path d="M 322 154 Q 330 162 338 154" stroke="#7A3D18" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="323" cy="140" r="2.5" fill="#241812"/>
    <circle cx="337" cy="140" r="2.5" fill="#241812"/>
  </g>

  <!-- Figure 4: Star Forward (KBFC Classic Yellow Kit) -->
  <g id="figure4">
    <!-- Body -->
    <path d="M 360 400 L 385 220 Q 430 210 475 220 L 500 400 Z" fill="#F4B800"/>
    <!-- Blue Collar -->
    <path d="M 415 222 L 430 245 L 445 222 Z" fill="#003B7A"/>
    <!-- Neck -->
    <rect x="417" y="186" width="26" height="36" rx="6" fill="#A86A40"/>
    <!-- Head -->
    <ellipse cx="430" cy="156" rx="27" ry="33" fill="#BA794C"/>
    <!-- Hair -->
    <path d="M 404 150 Q 415 120 435 122 Q 456 123 456 150 Q 442 136 422 138 Z" fill="#120D0A"/>
    <!-- Smile & Eyes -->
    <path d="M 421 168 Q 430 178 439 168" stroke="#603010" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="422" cy="153" r="2.5" fill="#1A1008"/>
    <circle cx="438" cy="153" r="2.5" fill="#1A1008"/>
  </g>

  <!-- Figure 5: Right Wing / Coach (Earthy Warm Linen Shirt) -->
  <g id="figure5">
    <!-- Body -->
    <path d="M 460 400 L 485 235 Q 525 225 565 235 L 595 400 Z" fill="#E8DEC8"/>
    <!-- Collar -->
    <path d="M 510 238 L 525 258 L 540 238 Z" fill="#D2C5AB"/>
    <!-- Neck -->
    <rect x="513" y="200" width="24" height="36" rx="6" fill="#D49970"/>
    <!-- Head -->
    <ellipse cx="525" cy="170" rx="27" ry="33" fill="#E0A780"/>
    <!-- Glasses & Hair -->
    <path d="M 498 165 Q 506 130 528 132 Q 550 134 552 165 Q 540 145 518 147 Z" fill="#4A4540"/>
    <rect x="509" y="163" width="13" height="9" rx="2" fill="none" stroke="#222222" stroke-width="2"/>
    <rect x="528" y="163" width="13" height="9" rx="2" fill="none" stroke="#222222" stroke-width="2"/>
    <line x1="522" y1="167" x2="528" y2="167" stroke="#222222" stroke-width="2"/>
    <!-- Smile -->
    <path d="M 517 184 Q 525 192 533 184" stroke="#7A3D18" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Arm-in-Arm Connection Lines (Overlapping Arms) -->
  <path d="M 160 250 Q 185 270 210 250" stroke="#003B7A" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M 260 240 Q 285 260 310 240" stroke="#F4B800" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M 360 235 Q 385 255 410 235" stroke="#F8F8F8" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M 460 245 Q 485 265 510 245" stroke="#F4B800" stroke-width="22" stroke-linecap="round" fill="none"/>

  <!-- Golden Hour Lighting / Sunlight Glow -->
  <rect width="600" height="400" fill="url(#sunGlow)"/>

  <!-- Bottom Dark Vignette / Shadow Overlay (Ensures 'Our Story' text stands out cleanly) -->
  <rect width="600" height="400" fill="url(#bottomShadow)"/>
</svg>
