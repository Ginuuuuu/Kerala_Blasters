<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1060" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2530"/>
      <stop offset="60%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="playerAura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#DDA477" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#003B7A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1060" fill="url(#bgGrad)"/>
  <rect width="800" height="1060" fill="url(#playerAura)"/>

  <!-- Subtle Tactical Pitch Grid Overlay -->
  <g stroke="#FFFFFF" stroke-width="1" opacity="0.04">
    <line x1="100" y1="0" x2="100" y2="1060"/>
    <line x1="250" y1="0" x2="250" y2="1060"/>
    <line x1="400" y1="0" x2="400" y2="1060"/>
    <line x1="550" y1="0" x2="550" y2="1060"/>
    <line x1="700" y1="0" x2="700" y2="1060"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
  </g>

  <!-- Player Athletic Silhouette -->
  <g fill="#1a202c" opacity="0.9">
    <!-- Head -->
    <circle cx="400" cy="340" r="105"/>
    <!-- Neck -->
    <path d="M 365 425 L 435 425 L 445 480 L 355 480 Z"/>
    <!-- Shoulders & Torso -->
    <path d="M 230 520 Q 400 480 570 520 L 620 900 L 180 900 Z"/>
  </g>

  <!-- Monogram Crest Detail on Chest -->
  <circle cx="400" cy="620" r="42" fill="#111111" stroke="#DDA477" stroke-width="2"/>
  <text x="400" y="632" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">KB</text>
  <circle cx="430" cy="630" r="4" fill="#DDA477"/>

  <!-- Subtle Vignette Frame -->
  <rect width="800" height="1060" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
</svg>
