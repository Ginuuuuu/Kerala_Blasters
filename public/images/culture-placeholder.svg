<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1330" width="100%" height="100%">
  <defs>
    <linearGradient id="cultGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="50%" stop-color="#11141a"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>
    <radialGradient id="stadiumGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#DDA477" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#003B7A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1330" fill="url(#cultGrad)"/>
  <rect width="1000" height="1330" fill="url(#stadiumGlow)"/>

  <!-- Geometric Matchday Flares and Atmosphere -->
  <g fill="#DDA477" opacity="0.15">
    <circle cx="300" cy="450" r="180"/>
    <circle cx="700" cy="400" r="220"/>
  </g>

  <!-- Stadium Tiers Line Art -->
  <path d="M 0 600 Q 500 520 1000 600 L 1000 900 Q 500 840 0 900 Z" fill="#141820" opacity="0.8"/>
  <path d="M 0 660 Q 500 590 1000 660" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15" fill="none"/>
  <path d="M 0 720 Q 500 650 1000 720" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15" fill="none"/>
  <path d="M 0 780 Q 500 710 1000 780" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15" fill="none"/>

  <!-- Monogram -->
  <text x="500" y="1050" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="64" fill="#FFFFFF" opacity="0.15" text-anchor="middle" letter-spacing="4">KERALA BLASTERS</text>
</svg>
