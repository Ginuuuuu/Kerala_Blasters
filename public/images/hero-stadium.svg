<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="floodlightL" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#FFF2D6" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#DDA477" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floodlightR" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#FFF2D6" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#DDA477" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stadiumSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="80%" stop-color="#151b26"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="pitchGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#052e16" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#02150b" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="1920" height="1080" fill="url(#stadiumSky)"/>

  <!-- Floodlight Beams -->
  <rect width="1920" height="1080" fill="url(#floodlightL)"/>
  <rect width="1920" height="1080" fill="url(#floodlightR)"/>

  <!-- Stadium Upper Tiers Silhouette -->
  <path d="M 0 540 Q 480 460 960 450 Q 1440 460 1920 540 L 1920 720 Q 1440 680 960 670 Q 480 680 0 720 Z" fill="#0d1117" opacity="0.85"/>
  <path d="M 0 580 Q 480 510 960 500 Q 1440 510 1920 580 L 1920 760 Q 1440 730 960 720 Q 480 730 0 760 Z" fill="#161d27" opacity="0.6"/>

  <!-- Floodlight Pylons -->
  <g stroke="#DDA477" stroke-width="2" opacity="0.35">
    <line x1="220" y1="80" x2="320" y2="480"/>
    <line x1="260" y1="80" x2="340" y2="480"/>
    <line x1="220" y1="80" x2="260" y2="80"/>
    <line x1="1700" y1="80" x2="1600" y2="480"/>
    <line x1="1660" y1="80" x2="1580" y2="480"/>
    <line x1="1700" y1="80" x2="1660" y2="80"/>
  </g>

  <!-- Pitch Horizon & Turf -->
  <path d="M 0 720 Q 960 680 1920 720 L 1920 1080 L 0 1080 Z" fill="url(#pitchGlow)"/>

  <!-- Pitch Lines -->
  <ellipse cx="960" cy="880" rx="320" ry="90" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.25"/>
  <line x1="120" y1="880" x2="1800" y2="880" stroke="#FFFFFF" stroke-width="2.5" opacity="0.25"/>
  <circle cx="960" cy="880" r="6" fill="#DDA477" opacity="0.8"/>

  <!-- Atmospheric Night Mist -->
  <rect y="600" width="1920" height="480" fill="black" opacity="0.45"/>
</svg>
